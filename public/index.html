<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b0a; --tile: #1c1a18; --edge-dark: #0a0908; --edge-light: #3d3833;
    --text: #d8d0c4; --muted: #8c847a;
    --waiting: #e02424; --error: #ff5a1f; --done: #f0cc3c; --working: #4f7cff; --idle: #5c5650;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 22px/1.1 "VT323", ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column; overflow: hidden;
    background-image:
      radial-gradient(ellipse at 50% 120%, #3a0d0844 0%, transparent 60%),
      repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 3px);
  }
  main { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
  #sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .tile {
    display: flex; gap: 12px; align-items: center; padding: 10px 12px; min-width: 0;
    background: var(--tile);
    border: 3px solid; border-color: var(--edge-light) var(--edge-dark) var(--edge-dark) var(--edge-light);
    box-shadow: inset 0 0 0 2px var(--c, var(--idle));
  }
  .tile .face { width: 80px; height: 92px; image-rendering: pixelated; flex: none; background: #000; }
  .tile .info { min-width: 0; }
  .tile .project { font-size: 34px; text-transform: uppercase; color: #fff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .status { color: var(--c); font-size: 24px; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .meta { color: var(--muted); font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s-waiting { --c: var(--waiting); animation: alarm 1s steps(2, jump-none) infinite; }
  .s-error { --c: var(--error); }
  .s-done { --c: var(--done); }
  .s-working { --c: var(--working); }
  .s-idle { --c: var(--idle); }
  .tile.offline { opacity: .4; filter: grayscale(1); animation: none; }
  @keyframes alarm { 50% { box-shadow: inset 0 0 0 2px var(--c), 0 0 18px 2px var(--c); } }
  .empty { color: var(--muted); font-size: 28px; text-align: center; margin-top: 15vh; }
  footer { flex: none; display: flex; justify-content: center; background: #000; }
  #bar { display: block; width: min(100vw, 320vh); aspect-ratio: 10 / 1; image-rendering: pixelated; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #flash.pain { background: #ff0000; animation: flash .45s ease-out; }
  #flash.pickup { background: #ffd84a; animation: flash .35s ease-out; }
  @keyframes flash { from { opacity: .35; } to { opacity: 0; } }
  #error { position: fixed; top: 8px; right: 12px; color: var(--waiting); font-size: 20px; }
  #login { max-width: 420px; margin: 15vh auto 0; text-align: center; }
  #login input { width: 100%; padding: 8px; font: inherit; background: #000; color: var(--text);
    border: 3px solid; border-color: var(--edge-dark) var(--edge-light) var(--edge-light) var(--edge-dark); }
  @media (prefers-reduced-motion: reduce) { .s-waiting { animation: none; box-shadow: inset 0 0 0 4px var(--c); } }
  @media (max-width: 600px) { main { padding: 12px; } #sessions { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <form id="login" hidden>
    <p>INTRODUCE EL TOKEN DEL HUB</p>
    <input name="token" type="password" autocomplete="off" required>
  </form>
  <div id="sessions"></div>
</main>
<footer><canvas id="bar" aria-label="Barra de estado"></canvas></footer>
<div id="flash"></div>
<div id="error" role="status"></div>
<script type="module" src="/ui/app.ts"></script>
</body>
</html>
