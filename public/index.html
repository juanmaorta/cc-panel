<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  /* Classic Mac: black on white. Status colors are dark enough for >= 4.5:1 on white. */
  :root {
    --bg: #ffffff; --tile: #ffffff; --ink: #000000; --text: #000000; --muted: #5f5f5f;
    --waiting: #c81e1e; --error: #c2410c; --done: #8a6d00; --working: #1d4ed8; --idle: #5f5f5f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 22px/1.1 "VT323", ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Classic Mac menu bar: 1-bit, black on white. */
  #menubar {
    flex: none; position: relative; z-index: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 22px;
    min-height: 40px; padding: 2px 16px 2px 8px; background: #fff; color: #000;
    border-bottom: 2px solid #000; font-size: 24px; line-height: 1;
  }
  #menucat { width: 32px; height: 32px; image-rendering: pixelated; }
  #menubar .brand { display: flex; align-items: center; gap: 6px; font-size: 26px; }
  #hosts { display: flex; gap: 12px; }
  #hosts .host:not(.online) { color: #777; }
  .limit { display: flex; align-items: center; gap: 8px; }
  .limit b { font-weight: normal; }
  .progress { width: 120px; height: 16px; border: 2px solid #000; background: #fff; }
  .progress .fill {
    display: block; height: 100%; max-width: 100%;
    background: repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0 / 4px 4px;
  }
  .progress .fill.full { background: #000; }
  #tally { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  #tally .hot { background: #000; color: #fff; padding: 0 4px; }
  #menubar #error { color: #fff; background: #000; padding: 0 4px; }
  #menubar #error:empty { display: none; }
  #clock { margin-left: auto; }
  #menubar.blink { animation: blink .5s steps(2, jump-none) 2; }
  @keyframes blink { 50% { filter: invert(1); } }
  html.beep { filter: invert(1); }
  main { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
  #sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  /* Tiles are classic Mac windows: 2px black frame, hard drop shadow, status ring inside. */
  .tile {
    display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 6px; min-width: 0; touch-action: manipulation;
    background: var(--tile); border: 2px solid var(--ink);
    box-shadow: inset 0 0 0 3px var(--c, var(--idle)), 3px 3px 0 var(--ink);
  }
  .tile .floor { display: block; image-rendering: pixelated; align-self: center; }
  .tile .info { min-width: 0; }
  .tile .project { font-size: 34px; text-transform: uppercase; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .status { color: var(--c); font-size: 24px; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .meta { color: var(--muted); font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s-waiting { --c: var(--waiting); animation: alarm 1s steps(2, jump-none) infinite; }
  .s-error { --c: var(--error); }
  .s-done { --c: var(--done); }
  .s-working { --c: var(--working); }
  .s-idle { --c: var(--idle); }
  .tile.offline { opacity: .45; filter: grayscale(1); animation: none; }
  @keyframes alarm { 50% { box-shadow: inset 0 0 0 6px var(--c), 3px 3px 0 var(--ink); } }
  .empty { color: var(--muted); font-size: 28px; text-align: center; margin-top: 15vh; }
  #login { max-width: 420px; margin: 15vh auto 0; text-align: center; }
  #login input { width: 100%; padding: 8px; font: inherit; background: var(--bg); color: var(--text);
    border: 2px solid var(--ink); }
  @media (prefers-reduced-motion: reduce) { .s-waiting { animation: none; box-shadow: inset 0 0 0 6px var(--c), 3px 3px 0 var(--ink); } }
  @media (prefers-reduced-motion: reduce) { #menubar.blink { animation: none; } }
  @media (max-width: 600px) {
    main { padding: 12px; } #sessions { grid-template-columns: 1fr; }
    #menubar { padding: 2px 12px 2px 4px; gap: 4px 12px; font-size: 20px; }
    .progress { width: 60px; } #clock, #menubar .brand .name { display: none; }
    #tally, #hosts { display: contents; }
  }
</style>
</head>
<body>
<header id="menubar">
  <span class="brand"><canvas id="menucat" aria-hidden="true"></canvas><span class="name">cc-panel</span></span>
  <span id="hosts"></span>
  <span class="limit" id="l5"><b>5H</b><span class="progress"><span class="fill"></span></span><span class="val">--</span></span>
  <span class="limit" id="l7"><b>SEM</b><span class="progress"><span class="fill"></span></span><span class="val">--</span></span>
  <span id="tally"></span>
  <span id="error" role="status"></span>
  <span id="clock"></span>
</header>
<main>
  <form id="login" hidden>
    <p>INTRODUCE EL TOKEN DEL HUB</p>
    <input name="token" type="password" autocomplete="off" required>
  </form>
  <div id="sessions"></div>
</main>
<script type="module" src="/ui/app.ts"></script>
</body>
</html>
